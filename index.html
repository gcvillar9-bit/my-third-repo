<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Fly through a realistic universe, from planet surfaces to the cosmic web."
    />
    <link rel="icon" href="data:," />
    <title>Cosmos</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ddd;
        overflow: hidden;
      }
      body {
        font:
          14px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app > canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      /* Boot splash: plain HTML and CSS so it shows before any script runs (src/app/splash.ts drives it). */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 60%, #0b1224 0%, #020409 60%, #000 100%);
        transition: opacity 0.6s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-box {
        width: min(340px, 80vw);
        text-align: center;
      }
      #boot .boot-title {
        font-size: 30px;
        font-weight: 300;
        letter-spacing: 0.5em;
        margin-right: -0.5em;
        color: #f1f5fb;
      }
      #boot .boot-sub {
        margin: 10px 0 18px;
        color: #8f9ab0;
        min-height: 1.4em;
      }
      #boot .boot-bar {
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      #boot .boot-bar i {
        display: block;
        width: 4%;
        height: 100%;
        background: #8fb4ff;
        transition: width 0.25s ease;
      }
      #boot.failed .boot-bar {
        display: none;
      }
      #boot.failed .boot-sub {
        color: #ffc56e;
      }
      #boot button {
        display: none;
        margin-top: 14px;
        font: inherit;
        color: inherit;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 7px;
        padding: 5px 14px;
        cursor: pointer;
      }
      #boot.failed button,
      #boot.slow button {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-box">
        <div class="boot-title">COSMOS</div>
        <div class="boot-sub">Loading the universe…</div>
        <div class="boot-bar"><i></i></div>
        <button type="button" onclick="location.reload()">Reload</button>
      </div>
    </div>
    <noscript>Cosmos needs JavaScript and WebGL2.</noscript>
    <script>
      // If the app's script has not started after 20 s (blocked, or the connection dropped), say so
      // and offer a reload. A script that does arrive later carries on and lifts the splash as usual.
      setTimeout(function () {
        var boot = document.getElementById('boot');
        if (!boot || document.documentElement.hasAttribute('data-cosmos')) return;
        boot.classList.add('slow');
        boot.querySelector('.boot-sub').textContent =
          'This is taking a while. Check your connection, or reload to try again.';
      }, 20000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
