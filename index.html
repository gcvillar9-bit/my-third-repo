<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Fly through a realistic universe, from planet surfaces to the cosmic web."
    />
    <link rel="icon" href="data:," />
    <title>Cosmos</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ddd;
        overflow: hidden;
      }
      body {
        font:
          14px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app > canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <noscript>Cosmos needs JavaScript and WebGL2.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
